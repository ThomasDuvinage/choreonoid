name: Package choreonoid
on:
  repository_dispatch:
    types:
    - package-master
  push:
    branches:
    - debian
jobs:
  package:
    uses: jrl-umi3218/github-actions/.github/workflows/package-project.yml@master
    with:
      main-branch: debian
      update-stable-and-head: true
      with-openrtm2: true
      deps: '["jrl-umi3218/mc_openrtm"]'
      matrix: |
          {
            "dist": ["focal", "jammy"],
            "arch": ["amd64"],
          }
    secrets:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
      GH_TOKEN: ${{ secrets.GH_PAGES_TOKEN }}
